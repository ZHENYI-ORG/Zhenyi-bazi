<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>八字排盘</title>
<style>
:root{--gold:#b69a61;--gold2:#9f8248;--ink:#151515;--muted:#b5b5b5;--line:#eeeeee;--bg:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg)}body{min-height:100dvh}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
.app{width:min(100%,460px);min-height:100dvh;margin:0 auto;background:var(--bg)}.content{padding:0 0 26px}.home-grid{display:block}.side-column{min-width:0}.form-card,.quick-card{background:#fff}.form-card{padding:0 16px 19px;border-radius:0 0 14px 14px}.line{min-height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.line-label{font-size:14px;white-space:nowrap;color:#202020}.name-line input{min-width:0;flex:1;border:0;outline:0;text-align:right;background:transparent;font-size:13px;color:#444;padding:10px 0}.name-line input::placeholder{color:#c7c7c7}.mode-line{height:40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}

.pick-btn,.group-btn{border:0;background:transparent;display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0;max-width:72%;padding:11px 0;color:#222}.pick-btn .value,.group-btn .value{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick-btn .placeholder{color:#c5c5c5}.arrow{width:7px;height:7px;border-top:1px solid #c2c2c2;border-right:1px solid #c2c2c2;transform:rotate(45deg);flex:none}.required-note{font-size:8px;color:#c9c9c9;margin-left:2px;vertical-align:middle}
.meta{position:relative;padding:10px 0 3px;min-height:58px}.meta-row{font-size:9px;line-height:17px;color:#c2c2c2;display:flex;align-items:center;gap:4px}.meta-key{color:#c0c0c0}.save-wrap{position:absolute;right:0;top:16px;display:flex;align-items:center;gap:5px;color:#333}.save-wrap>span{font-size:11px}.switch{width:32px;height:20px;border:0;border-radius:999px;background:#dedede;position:relative;padding:0;transition:.18s}.switch:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.14);transition:.18s}.switch.on{background:var(--gold)}.switch.on:after{left:14px}.submit{width:100%;height:42px;border:0;border-radius:24px;background:#030303;color:#c7a76a;font-weight:650;font-size:14px;letter-spacing:.08em;margin-top:4px}.submit:disabled{opacity:.58}.error{min-height:0;color:#bd5849;text-align:center;font-size:10px;padding-top:7px}.error:empty{display:none}
.quick-card{margin-top:28px;border-radius:14px;min-height:92px;padding:12px 16px;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.02)}.quick-left{min-width:0}.quick-pillars{display:grid;grid-template-columns:repeat(4,1fr);width:112px;margin-bottom:5px}.quick-pillar{display:flex;flex-direction:column;align-items:flex-start;line-height:17px}.quick-pillar b{font-size:14px;font-weight:500}.quick-date{font-size:8px;line-height:13px;color:#777;white-space:nowrap}.quick-right{text-align:center;border-left:1px solid #f0f0f0;padding-left:10px}.quick-clock{display:flex;justify-content:center;align-items:baseline;gap:5px;margin-bottom:9px}.quick-clock b{font-size:16px;font-weight:500}.quick-clock strong{font-size:20px;font-weight:400}.quick-now{height:30px;min-width:108px;border:1px solid #e2e2e2;border-radius:18px;background:#fff;font-size:12px;color:#333}.data-note{text-align:center;color:#c9c9c9;font-size:9px;padding-top:10px}
.saved-card{margin-top:14px;background:#fff;border-radius:14px;padding:0 14px 8px}.saved-head{height:46px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.saved-head b{font-size:13px;font-weight:600}.saved-head span{font-size:10px;color:#aaa}.saved-list{max-height:268px;overflow:auto;scrollbar-width:none}.saved-list::-webkit-scrollbar{display:none}.saved-empty{padding:28px 6px;text-align:center;color:#b5b5b5;font-size:11px;line-height:18px}.saved-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f1f1}.saved-item:last-child{border-bottom:0}.saved-main{min-width:0}.saved-title{display:flex;align-items:center;gap:6px;margin-bottom:4px}.saved-title b{font-size:13px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.saved-title i{font-style:normal;font-size:9px;color:#9a7d43;background:#f7f1e4;border-radius:8px;padding:2px 5px}.saved-sub{font-size:10px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:15px}.saved-actions{display:flex;gap:5px}.saved-actions button{height:28px;border:1px solid #e7e7e7;background:#fff;border-radius:14px;padding:0 9px;font-size:10px;color:#666}.saved-actions .load{border-color:#d9c9a6;color:#8d713b;background:#fbf8f1}.saved-actions .delete{width:28px;padding:0;color:#aaa}.saved-tip{padding:7px 0 2px;font-size:9px;color:#c2c2c2;text-align:center}
.mask{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center}.mask.show{display:flex}.sheet{width:min(100%,460px);background:#fff;border-radius:14px 14px 0 0;padding-bottom:max(10px,env(safe-area-inset-bottom));box-shadow:0 -10px 32px rgba(0,0,0,.12)}.sheet-head{height:50px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0eee9;padding:0 12px}.sheet-head b{font-size:15px}.sheet-head button{border:0;background:transparent;padding:11px 10px;font-size:13px;color:#8d8981}.sheet-head .ok{color:var(--gold2);font-weight:600}
.wheels{display:grid;grid-template-columns:1.2fr .9fr .9fr .9fr .9fr;position:relative;padding:10px 8px 12px}.wheels:before{content:"";position:absolute;left:8px;right:8px;top:88px;height:39px;background:#f7f5ef;border-top:1px solid #eee8dc;border-bottom:1px solid #eee8dc;pointer-events:none}.wheel{height:190px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;padding:76px 0}.wheel::-webkit-scrollbar{display:none}.wheel button{height:39px;width:100%;display:block;border:0;background:transparent;color:#b2aea5;scroll-snap-align:center;position:relative;z-index:1;font-size:14px;white-space:nowrap}.wheel button.selected{color:#25231f;font-size:15px;font-weight:600}.lunar-tool{display:none;align-items:center;justify-content:flex-end;gap:7px;color:#777269;font-size:12px;padding:0 18px 7px}.lunar-tool.show{display:flex}
.place-sheet{height:min(88dvh,690px);display:flex;flex-direction:column}.place-search{padding:12px 14px 8px}.search-box{height:39px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;padding:0 12px;gap:8px}.search-icon{width:13px;height:13px;border:1.4px solid #999;border-radius:50%;position:relative;flex:none}.search-icon:after{content:"";width:5px;border-top:1.4px solid #999;position:absolute;right:-4px;bottom:-2px;transform:rotate(45deg)}.search-box input{border:0;outline:0;background:transparent;width:100%;font-size:13px}.place-tabs{height:42px;border-bottom:1px solid #edeae4;display:flex;padding:0 14px;gap:24px;align-items:flex-end}.place-tab{border:0;background:transparent;height:42px;padding:0 2px;color:#918c83;font-size:13px;position:relative}.place-tab.active{color:#28251f;font-weight:600}.place-tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold)}.place-breadcrumb{height:34px;padding:0 14px;display:flex;align-items:center;color:#aaa59c;font-size:11px;border-bottom:1px solid #f4f2ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place-list{flex:1;overflow:auto;padding:0 14px}.place-item{min-height:45px;width:100%;border:0;border-bottom:1px solid #f1efeb;background:#fff;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:0 2px;color:#3c3934}.place-item span{font-size:14px}.place-item small{font-size:11px;color:#b0aca4}.place-item.selected span{color:var(--gold2);font-weight:600}.place-item.selected:after{content:"✓";color:var(--gold);font-size:14px}.place-empty{padding:40px 10px;text-align:center;color:#aaa59d;font-size:13px}.search-result .path{font-size:13px}.search-result .path em{font-style:normal;color:#aaa59c;margin:0 5px}.place-foot{padding:10px 14px 2px;border-top:1px solid #eeeae4}.selected-path{font-size:11px;color:#98938a;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place-confirm{height:40px;width:100%;border:0;border-radius:20px;background:#111;color:#c7a76a;font-size:14px}.place-confirm:disabled{opacity:.45}
.group-sheet{padding-bottom:18px}.group-list{padding:6px 16px 10px}.group-list button{width:100%;height:48px;border:0;border-bottom:1px solid #f1f1f1;background:#fff;text-align:left;font-size:14px;color:#333;position:relative}.group-list button.active{color:var(--gold2);font-weight:600}.group-list button.active:after{content:"✓";position:absolute;right:4px;color:var(--gold)}.toast{position:fixed;z-index:120;left:50%;bottom:72px;transform:translateX(-50%);background:rgba(25,25,25,.9);color:#fff;padding:8px 13px;border-radius:999px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(min-width:700px){body{padding:24px 0}.app{min-height:calc(100dvh - 48px);border-radius:16px}.form-card{border-radius:14px}.mask{align-items:center}.mask .sheet{border-radius:14px;max-height:86dvh}.mask .place-sheet{height:min(82dvh,680px)}}
@media(min-width:900px){body{padding:34px 24px}.app{width:min(100%,1060px);min-height:calc(100dvh - 68px);background:transparent}.content{padding:0}.home-grid{display:grid;grid-template-columns:minmax(460px,500px) minmax(340px,1fr);gap:24px;align-items:start}.form-card{padding:6px 22px 22px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.035)}.line,.mode-line{min-height:48px}.mode-line{height:48px}.line-label{font-size:14px}.name-line input{font-size:13px}.pick-btn,.group-btn{padding:14px 0}.meta{min-height:68px;padding-top:13px}.save-wrap{top:20px}.submit{height:46px;border-radius:24px;font-size:14px}.quick-card{margin-top:0;min-height:116px;border-radius:18px;padding:18px 20px;box-shadow:0 8px 30px rgba(0,0,0,.035)}.quick-pillars{width:156px}.quick-pillar{align-items:center}.quick-pillar b{font-size:16px;line-height:20px}.quick-date{font-size:9px;line-height:15px}.quick-clock b{font-size:17px}.quick-clock strong{font-size:23px}.quick-now{min-width:120px;height:32px}.saved-card{margin-top:18px;border-radius:18px;padding:0 18px 10px;box-shadow:0 8px 30px rgba(0,0,0,.035)}.saved-head{height:52px}.saved-list{max-height:360px}.saved-item{padding:12px 0}.data-note{padding-top:12px}.sheet{width:min(520px,calc(100vw - 48px))}.place-sheet{width:min(660px,calc(100vw - 48px))}}
</style>
</head>
<body>
<div class="app">
<button id="back" hidden type="button"></button>
<main class="content"><div class="home-grid">
<section class="form-card">
  <div class="line name-line"><span class="line-label">姓名</span><input id="name" maxlength="12" autocomplete="off" placeholder="请输入姓名"></div>
  <div class="mode-line"><div class="seg" id="gender"><button class="active" data-value="male" type="button">男</button><button data-value="female" type="button">女</button></div><div class="seg calendar" id="calendar"><button class="active" data-value="solar" type="button">公历</button><button data-value="lunar" type="button">农历</button><button data-value="pillars" type="button">四柱</button></div></div>
  <div class="line"><span class="line-label">出生时间<span class="required-note">(必填)</span></span><button id="birthBtn" class="pick-btn" type="button"><span id="birthText" class="value">1990-01-01 00:00</span><i class="arrow"></i></button></div>
  <div class="line"><span class="line-label">出生地点</span><button id="placeBtn" class="pick-btn" type="button"><span id="placeText" class="value placeholder">未知地 北京时间 --</span><i class="arrow"></i></button></div>
  <div class="line"><span class="line-label">分组</span><button id="groupBtn" class="group-btn" type="button"><span id="groupText" class="value">全部</span><i class="arrow"></i></button></div>
  <div class="meta"><div class="save-wrap"><span>保存</span><button id="saveSwitch" class="switch on" type="button" role="switch" aria-checked="true"></button></div><div class="meta-row"><span class="meta-key">真太阳时：</span><span id="solarPreview">计算中…</span></div><div class="meta-row"><span class="meta-key">地址经纬：</span><span id="coordText">北纬30.00 东经120.00</span></div></div>
  <button id="submit" class="submit" type="button">开始排盘</button><div id="error" class="error"></div>
</section>
<aside class="side-column">
<section class="quick-card" aria-label="即时排盘">
  <div class="quick-left"><div class="quick-pillars"><span class="quick-pillar" id="quick-year"><b>—</b><b>—</b></span><span class="quick-pillar" id="quick-month"><b>—</b><b>—</b></span><span class="quick-pillar" id="quick-day"><b>—</b><b>—</b></span><span class="quick-pillar" id="quick-hour"><b>—</b><b>—</b></span></div><div id="quickLunarDate" class="quick-date">农历：—</div><div id="quickSolarDate" class="quick-date">公历：—</div></div>
  <div class="quick-right"><div class="quick-clock"><b id="quickHour">—时</b><strong id="quickTime">--:--</strong></div><button id="quickNow" class="quick-now" type="button">即时排盘</button></div>
</section>
<section class="saved-card" aria-label="已保存命盘"><div class="saved-head"><b>已保存命盘</b><span id="savedCount">0 个</span></div><div id="savedList" class="saved-list"></div><div class="saved-tip">保存在当前浏览器，可载入后再次排盘</div></section>
<div class="data-note">出生地点支持全国省 / 市 / 区县三级选择与搜索</div>
</aside></div></main></div>
<div id="timeMask" class="mask" aria-hidden="true"><section class="sheet"><div class="sheet-head"><button data-close="timeMask" type="button">取消</button><b>选择出生时间</b><button id="timeConfirm" class="ok" type="button">确定</button></div><div id="lunarTool" class="lunar-tool"><span>当前为农历日期</span><span>闰月</span><button id="leapSwitch" class="switch" type="button"></button></div><div class="wheels"><div id="yearWheel" class="wheel"></div><div id="monthWheel" class="wheel"></div><div id="dayWheel" class="wheel"></div><div id="hourWheel" class="wheel"></div><div id="minuteWheel" class="wheel"></div></div></section></div>
<div id="placeMask" class="mask" aria-hidden="true"><section class="sheet place-sheet"><div class="sheet-head"><button data-close="placeMask" type="button">取消</button><b>选择出生地区</b><button id="clearPlace" type="button">清空</button></div><div class="place-search"><label class="search-box"><i class="search-icon"></i><input id="placeSearch" autocomplete="off" placeholder="搜索省 / 市 / 区县，如：余杭区"></label></div><div class="place-tabs" id="placeTabs"><button class="place-tab active" data-step="province" type="button"><span id="provinceTab">省份</span></button><button class="place-tab" data-step="city" type="button"><span id="cityTab">城市</span></button><button class="place-tab" data-step="area" type="button"><span id="areaTab">区县</span></button></div><div id="placeBreadcrumb" class="place-breadcrumb">请选择出生省份</div><div id="placeList" class="place-list"></div><div class="place-foot"><div id="selectedPath" class="selected-path">未选择地区</div><button id="placeConfirm" class="place-confirm" type="button" disabled>确定</button></div></section></div>
<div id="groupMask" class="mask" aria-hidden="true"><section class="sheet group-sheet"><div class="sheet-head"><button data-close="groupMask" type="button">取消</button><b>选择分组</b><span style="width:48px"></span></div><div id="groupList" class="group-list"><button class="active" data-group="全部" type="button">全部</button><button data-group="家人" type="button">家人</button><button data-group="朋友" type="button">朋友</button><button data-group="客户" type="button">客户</button></div></section></div>
<div id="toast" class="toast"></div>
<script src="./assets/china-regions.js"></script>
<script>
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
const lunarMonths=['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
const lunarDays=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
const state={gender:'male',calendar:'solar',year:1990,month:1,day:1,hour:0,minute:0,isLeap:false,province:null,city:null,area:null,region:'未知地区',longitude:120,latitude:30,save:true};
let placeDraft={province:null,city:null,area:null,step:'province'};
const FLAT=[];for(const p of (window.CHINA_REGIONS||[])){for(const c of p.s){for(const a of c.s){FLAT.push({p,c,a,text:`${p.n} ${c.n} ${a.n}`})}}}
function toast(text){const e=$('toast');e.textContent=text;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600)}
function showMask(id){$(id).classList.add('show');$(id).setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function hideMask(id){$(id).classList.remove('show');$(id).setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hideMask(b.dataset.close));document.querySelectorAll('.mask').forEach(m=>m.onclick=e=>{if(e.target===m)hideMask(m.id)});
$('back').onclick=()=>history.length>1?history.back():void 0;
function daysInMonth(y,m){return new Date(y,m,0).getDate()}function dateValue(){return `${state.year}-${pad(state.month)}-${pad(state.day)}`}function timeValue(){return `${pad(state.hour)}:${pad(state.minute)}`}
function displayBirth(){return state.calendar==='lunar'?`农历 ${state.year}年${state.isLeap?'闰':''}${lunarMonths[state.month-1]}${lunarDays[state.day-1]} ${timeValue()}`:`${dateValue()} ${timeValue()}`}
function isVirtualCity(c){return !!c&&['市辖区','县','自治区','省直辖县级行政区划'].includes(c.n)}
function friendlyCity(c,p){if(!c)return'';return isVirtualCity(c)?p.n:c.n}
function regionPath(p,c,a,sep=' '){const parts=[];if(p)parts.push(p.n);if(c&&!isVirtualCity(c)&&c.n!==p?.n)parts.push(c.n);if(a&&a.n!=='全境'&&a.n!==c?.n)parts.push(a.n);return parts.join(sep)}
function displayRegion(){return state.area?regionPath(state.province,state.city,state.area):'未知地区'}
function syncUI(){
  $('birthText').textContent=displayBirth();
  $('placeText').textContent=state.area?displayRegion():'未知地 北京时间 --';$('placeText').classList.toggle('placeholder',!state.area);
  $('coordText').textContent=`北纬${Number(state.latitude).toFixed(2)} 东经${Number(state.longitude).toFixed(2)}`;
  $('lunarTool').classList.toggle('show',state.calendar==='lunar');$('leapSwitch').classList.toggle('on',state.isLeap);
  previewSolar();
}
function bindSeg(id,key){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.value==='pillars'){toast('四柱直输入口已保留，当前排盘引擎暂未接入四柱反推出生信息');return}[...$(id).querySelectorAll('button')].forEach(x=>x.classList.toggle('active',x===b));state[key]=b.dataset.value;if(key==='calendar'&&state.calendar!=='lunar')state.isLeap=false;buildWheels();syncUI()}}
bindSeg('gender','gender');bindSeg('calendar','calendar');
function makeWheel(id,items,current,onChange){const w=$(id);let selected=Number(current);w.innerHTML=items.map(o=>`<button type="button" data-value="${o.value}">${o.label}</button>`).join('');const mark=v=>{selected=Number(v);[...w.children].forEach(x=>x.classList.toggle('selected',Number(x.dataset.value)===selected))};const commit=v=>{v=Number(v);if(v===selected)return;mark(v);onChange&&onChange(v)};mark(current);requestAnimationFrame(()=>w.querySelector('.selected')?.scrollIntoView({block:'center'}));let timer;w.onscroll=()=>{clearTimeout(timer);timer=setTimeout(()=>{const center=w.getBoundingClientRect().top+w.clientHeight/2;let best,dist=1e9;[...w.children].forEach(b=>{const r=b.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-center);if(d<dist){best=b;dist=d}});if(best)commit(best.dataset.value)},72)};w.onclick=e=>{const b=e.target.closest('button');if(!b)return;b.scrollIntoView({block:'center',behavior:'smooth'});commit(b.dataset.value)}}
function buildWheels(){const years=[];for(let y=1900;y<=new Date().getFullYear()+1;y++)years.push({value:y,label:y+'年'});const months=Array.from({length:12},(_,i)=>({value:i+1,label:state.calendar==='lunar'?lunarMonths[i]:(i+1)+'月'}));let max=state.calendar==='lunar'?30:daysInMonth(state.year,state.month);if(state.day>max)state.day=max;const days=Array.from({length:max},(_,i)=>({value:i+1,label:state.calendar==='lunar'?lunarDays[i]:(i+1)+'日'}));const hours=Array.from({length:24},(_,i)=>({value:i,label:pad(i)+'时'}));const mins=Array.from({length:60},(_,i)=>({value:i,label:pad(i)+'分'}));makeWheel('yearWheel',years,state.year,v=>{state.year=v;buildWheels()});makeWheel('monthWheel',months,state.month,v=>{state.month=v;buildWheels()});makeWheel('dayWheel',days,state.day,v=>state.day=v);makeWheel('hourWheel',hours,state.hour,v=>state.hour=v);makeWheel('minuteWheel',mins,state.minute,v=>state.minute=v)}
$('birthBtn').onclick=()=>{buildWheels();showMask('timeMask')};$('timeConfirm').onclick=()=>{hideMask('timeMask');syncUI()};$('leapSwitch').onclick=()=>{state.isLeap=!state.isLeap;$('leapSwitch').classList.toggle('on',state.isLeap)};

function provinceByCode(code){return CHINA_REGIONS.find(p=>p.c===code)||null}function cityByCode(p,code){return p?.s.find(c=>c.c===code)||null}function areaByCode(c,code){return c?.s.find(a=>a.c===code)||null}
function copyCurrentToDraft(){placeDraft={province:state.province,city:state.city,area:state.area,step:state.area?'area':state.city?'city':'province'}}
function setPlaceStep(step){if(step==='city'&&!placeDraft.province)return;if(step==='area'&&!placeDraft.city)return;placeDraft.step=step;renderPlacePicker()}
function tabLabel(node,fallback){return node?node.n:fallback}
function renderPlacePicker(){
  const q=$('placeSearch').value.trim();
  $('provinceTab').textContent=placeDraft.province?placeDraft.province.n:'省份';$('cityTab').textContent=placeDraft.city?friendlyCity(placeDraft.city,placeDraft.province):'城市';$('areaTab').textContent=placeDraft.area?placeDraft.area.n:'区县';
  [...$('placeTabs').querySelectorAll('.place-tab')].forEach(b=>b.classList.toggle('active',b.dataset.step===placeDraft.step&&!q));
  $('selectedPath').textContent=placeDraft.area?regionPath(placeDraft.province,placeDraft.city,placeDraft.area,' / '):'未选择完整地区';$('placeConfirm').disabled=!placeDraft.area;
  if(q){renderSearch(q);return}
  let list=[],crumb='请选择出生省份';
  if(placeDraft.step==='province'){list=CHINA_REGIONS.map(p=>({type:'province',n:p.n,sub:`${p.s.length}个城市`,node:p,selected:placeDraft.province?.c===p.c}))}
  else if(placeDraft.step==='city'){list=(placeDraft.province?.s||[]).map(c=>({type:'city',n:friendlyCity(c,placeDraft.province),sub:`${c.s.length}个区县`,node:c,selected:placeDraft.city?.c===c.c}));crumb=placeDraft.province?.n||crumb}
  else{list=(placeDraft.city?.s||[]).map(a=>({type:'area',n:a.n,sub:`东经${Number(a.x).toFixed(2)}`,node:a,selected:placeDraft.area?.c===a.c}));crumb=regionPath(placeDraft.province,placeDraft.city,null,' / ')}
  $('placeBreadcrumb').textContent=crumb;$('placeList').innerHTML=list.map((x,i)=>`<button class="place-item ${x.selected?'selected':''}" type="button" data-i="${i}"><span>${x.n}</span>${x.selected?'':`<small>${x.sub}</small>`}</button>`).join('')||'<div class="place-empty">暂无数据</div>';
  $('placeList').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const x=list[+b.dataset.i];if(x.type==='province'){placeDraft.province=x.node;placeDraft.city=null;placeDraft.area=null;placeDraft.step='city'}else if(x.type==='city'){placeDraft.city=x.node;placeDraft.area=null;placeDraft.step='area'}else{placeDraft.area=x.node}renderPlacePicker()}
}
function renderSearch(q){const key=q.toLowerCase();const results=FLAT.filter(x=>x.text.toLowerCase().includes(key)).slice(0,100);$('placeBreadcrumb').textContent=`搜索“${q}” · ${results.length}${results.length===100?'+':''}条`;$('placeList').innerHTML=results.map((x,i)=>`<button class="place-item search-result" type="button" data-search-i="${i}"><span class="path">${regionPath(x.p,x.c,x.a,'<em>›</em>')}</span><small>东经${Number(x.a.x).toFixed(2)}</small></button>`).join('')||'<div class="place-empty">没有匹配地区，请换一个关键词</div>';$('placeList').onclick=e=>{const b=e.target.closest('[data-search-i]');if(!b)return;const x=results[+b.dataset.searchI];placeDraft={province:x.p,city:x.c,area:x.a,step:'area'};$('placeSearch').value='';renderPlacePicker()}}
$('placeTabs').onclick=e=>{const b=e.target.closest('[data-step]');if(b)setPlaceStep(b.dataset.step)};$('placeSearch').oninput=()=>renderPlacePicker();
$('placeBtn').onclick=()=>{copyCurrentToDraft();$('placeSearch').value='';renderPlacePicker();showMask('placeMask');setTimeout(()=>$('placeSearch').focus(),120)};
$('clearPlace').onclick=()=>{state.province=state.city=state.area=null;state.region='未知地区';state.longitude=120;state.latitude=30;placeDraft={province:null,city:null,area:null,step:'province'};$('placeSearch').value='';hideMask('placeMask');syncUI()};
$('placeConfirm').onclick=()=>{if(!placeDraft.area)return;state.province=placeDraft.province;state.city=placeDraft.city;state.area=placeDraft.area;state.region=displayDraftRegion();state.longitude=Number(placeDraft.area.x)||Number(placeDraft.city?.x)||Number(placeDraft.province?.x)||120;state.latitude=Number(placeDraft.area.y)||Number(placeDraft.city?.y)||Number(placeDraft.province?.y)||30;hideMask('placeMask');syncUI()};
function displayDraftRegion(){return regionPath(placeDraft.province,placeDraft.city,placeDraft.area)}
$('saveSwitch').onclick=()=>{state.save=!state.save;$('saveSwitch').classList.toggle('on',state.save);$('saveSwitch').setAttribute('aria-checked',state.save?'true':'false')};
let previewToken=0;function payload(){return{name:$('name').value.trim(),gender:state.gender,is_lunar:state.calendar==='lunar',is_leap:state.isLeap,birthday:dateValue(),birth_time:timeValue(),birth_region:state.area?displayRegion():'未知地区',longitude:state.longitude,latitude:state.latitude,area_code:state.area?.c||'',group:selectedGroup}}
const SAVED_LIST_KEY='baziSavedProfilesV2';
function savedProfiles(){try{const x=JSON.parse(localStorage.getItem(SAVED_LIST_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function writeSavedProfiles(list){localStorage.setItem(SAVED_LIST_KEY,JSON.stringify(list.slice(0,80)));renderSavedProfiles()}
function storedProfile(p){return{...p,calendar:state.calendar,isLeap:state.isLeap,provinceCode:state.province?.c||'',cityCode:state.city?.c||'',areaCode:state.area?.c||'',displayBirth:displayBirth(),displayRegion:state.area?displayRegion():'未知地区',savedAt:Date.now()}}
function profileKey(s){return [s.name||'',s.gender||'',s.birthday||'',s.birth_time||'',s.areaCode||s.area_code||s.birth_region||'',s.group||'全部'].join('|')}
function upsertSavedProfile(s){let list=savedProfiles(),key=profileKey(s);list=list.filter(x=>profileKey(x)!==key);list.unshift(s);writeSavedProfiles(list);localStorage.setItem('baziSavedProfile',JSON.stringify(s))}
function renderSavedProfiles(){const list=savedProfiles();$('savedCount').textContent=`${list.length} 个`;$('savedList').innerHTML=list.length?list.slice(0,12).map((s,i)=>`<div class="saved-item"><div class="saved-main"><div class="saved-title"><b>${escapeHtml(s.name||'未命名')}</b><i>${s.gender==='female'?'女命':'男命'} · ${escapeHtml(s.group||'全部')}</i></div><div class="saved-sub">${escapeHtml(s.displayBirth||`${s.birthday||''} ${s.birth_time||''}`)}</div><div class="saved-sub">${escapeHtml(s.displayRegion||s.birth_region||'未知地区')}</div></div><div class="saved-actions"><button class="load" type="button" data-load="${i}">载入</button><button class="delete" type="button" data-delete="${i}" aria-label="删除">×</button></div></div>`).join(''):'<div class="saved-empty">打开“保存”后完成排盘，命盘资料会出现在这里。<br>以后无需重复填写出生信息。</div>'}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function applySavedProfile(s){if(!s)return;$('name').value=s.name||'';state.gender=s.gender||'male';state.calendar=s.calendar||(s.is_lunar?'lunar':'solar');state.isLeap=!!(s.isLeap??s.is_leap);const d=String(s.birthday||'').split('-'),t=String(s.birth_time||'').split(':');if(d.length===3){state.year=+d[0]||1990;state.month=+d[1]||1;state.day=+d[2]||1}if(t.length>=2){state.hour=+t[0]||0;state.minute=+t[1]||0}let p=provinceByCode(s.provinceCode),c=cityByCode(p,s.cityCode),a=areaByCode(c,s.areaCode||s.area_code);if(!a&&(s.areaCode||s.area_code)){for(const pp of CHINA_REGIONS){for(const cc of pp.s){const aa=cc.s.find(x=>x.c===(s.areaCode||s.area_code));if(aa){p=pp;c=cc;a=aa;break}}if(a)break}}state.province=p||null;state.city=c||null;state.area=a||null;state.region=a?regionPath(p,c,a):(s.birth_region||'未知地区');state.longitude=a?+a.x:(+s.longitude||120);state.latitude=a?+a.y:(+s.latitude||30);selectedGroup=s.group||'全部';state.save=true;[...$('gender').querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.value===state.gender));[...$('calendar').querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.value===state.calendar));[...$('groupList').querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.group===selectedGroup));$('groupText').textContent=selectedGroup;$('saveSwitch').classList.add('on');$('saveSwitch').setAttribute('aria-checked','true');buildWheels();syncUI()}
$('savedList').onclick=e=>{const load=e.target.closest('[data-load]'),del=e.target.closest('[data-delete]'),list=savedProfiles();if(load){applySavedProfile(list[+load.dataset.load]);toast('已载入命盘信息');if(innerWidth<900)scrollTo({top:0,behavior:'smooth'})}if(del){const i=+del.dataset.delete;list.splice(i,1);writeSavedProfiles(list);toast('已删除')}};
async function previewSolar(){const token=++previewToken;$('solarPreview').textContent='计算中…';try{const r=await fetch('./api/paipan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});const j=await r.json();if(token!==previewToken)return;$('solarPreview').textContent=j.ok?(j.data.solar_time||`${dateValue()} ${timeValue()}`):`${dateValue()} ${timeValue()}`}catch(e){if(token===previewToken)$('solarPreview').textContent=`${dateValue()} ${timeValue()}`}}
$('submit').onclick=async()=>{const btn=$('submit');$('error').textContent='';btn.disabled=true;btn.textContent='排盘中…';try{const p=payload();const r=await fetch('./api/paipan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json();if(!j.ok)throw new Error(j.message||'排盘失败');const saved=storedProfile(p);if(state.save)upsertSavedProfile(saved);sessionStorage.setItem('baziChartResult',JSON.stringify({data:j.data,profile:p,display:{birth:displayBirth(),region:state.area?displayRegion():'未知地区',calendar:state.calendar},storage:saved,saved:state.save}));location.href='./result.html'}catch(err){$('error').textContent=err.message||'排盘失败，请检查出生信息';btn.disabled=false;btn.textContent='开始排盘'}};
function restore(){try{const s=JSON.parse(localStorage.getItem('baziSavedProfile')||'null');if(s)applySavedProfile(s)}catch(e){}}
let selectedGroup='全部';
function openGroup(){showMask('groupMask')}
$('groupBtn').onclick=openGroup;
$('groupList').onclick=e=>{const b=e.target.closest('[data-group]');if(!b)return;selectedGroup=b.dataset.group;$('groupText').textContent=selectedGroup;[...$('groupList').querySelectorAll('button')].forEach(x=>x.classList.toggle('active',x===b));hideMask('groupMask')};
function quickLunar(d){try{return new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{year:'numeric',month:'long',day:'numeric'}).format(d).replace(/\s+/g,'')}catch{return '—'}}
function quickDate(d){return `${d.getFullYear()}年${pad(d.getMonth()+1)}月${pad(d.getDate())}日`}
function quickTime(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
let quickToken=0;
async function refreshQuick(){const now=new Date(),token=++quickToken;$('quickTime').textContent=quickTime(now);$('quickSolarDate').textContent=`公历：${quickDate(now)} ${quickTime(now)}`;$('quickLunarDate').textContent=`农历：${quickLunar(now)}`;try{const p={name:'即时',gender:state.gender,is_lunar:false,is_leap:false,birthday:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`,birth_time:quickTime(now),birth_region:state.area?displayRegion():'未知地区',longitude:state.longitude,latitude:state.latitude};const r=await fetch('./api/paipan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),j=await r.json();if(token!==quickToken||!j.ok)return;const b=j.data.bazi||{},pairs=[b.year_pillar,b.month_pillar,b.day_pillar,b.hour_pillar];['year','month','day','hour'].forEach((k,i)=>{const el=$('quick-'+k);if(el)el.innerHTML=`<b>${pairs[i]?.heavenly_stem||'—'}</b><b>${pairs[i]?.earthly_branch||'—'}</b>`});const hp=b.hour_pillar;$('quickHour').textContent=`${hp?.heavenly_stem||''}${hp?.earthly_branch||''}时`; }catch{}}
$('quickNow').onclick=()=>{const now=new Date();state.calendar='solar';state.isLeap=false;state.year=now.getFullYear();state.month=now.getMonth()+1;state.day=now.getDate();state.hour=now.getHours();state.minute=now.getMinutes();[...$('calendar').querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.value==='solar'));buildWheels();syncUI();setTimeout(()=>$('submit').click(),50)};
restore();buildWheels();syncUI();renderSavedProfiles();refreshQuick();setInterval(refreshQuick,60000);
</script>
</body></html>
